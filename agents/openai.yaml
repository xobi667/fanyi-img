interface:
  display_name: "xobi-img"
  short_description: "无参考纯生图、显式电商主图、翻译编辑与 Logo 批处理"
  default_prompt: "使用 $xobi-img 默认无参考纯生图处理图片；只有我明确要求制作、重做、重新设计或整体优化整张主图时进入创意主图路线，翻译主图、局部修改或只检查主图都不进入，并补齐平台、视觉方向、比例和文字策略。只有我明确要求添加 Logo 且确认本次 Logo 资产时才启用 Logo 例外；资产可以是我提供的 Logo，也可以是我明确选择的默认 Logo。无真实遮挡不调用图片模型直接叠加，有遮挡才局部参考重排后叠加。"
